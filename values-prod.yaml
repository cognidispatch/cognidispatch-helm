global:
  namespace: cogni-prod
  imageRegistry: cogniregistry.azurecr.io
  imagePullPolicy: Always
  imageTag: latest

nginx:
  enabled: true
  replicas: 2
  image: cogni-nginx
  imageTag: v2
  nodePort: 30500
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

authService:
  enabled: true
  replicas: 2
  image: cogni-auth-service
  imageTag: "v0.1.1"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

vendorService:
  enabled: true
  replicas: 2
  image: cogni-vendor-service
  imageTag: "v0.1.1"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

aiService:
  enabled: true
  replicas: 2
  image: cogni-ai-service
  imageTag: "v0.1.3"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

adminService:
  enabled: true
  replicas: 2
  image: cogni-admin-service
  imageTag: "v0.1.1"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

dispatchService:
  enabled: true
  replicas: 2
  image: cogni-dispatch-service
  imageTag: "v0.1.1"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

paymentService:
  enabled: true
  replicas: 2
  image: cogni-payment-service
  imageTag: "v0.1.1"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

frontend:
  enabled: true
  replicas: 2
  image: cogni-frontend
  imageTag: "v0.1.1"
  nodePort: 30080
  resources:
    requests:
      memory: "256Mi"
      cpu: "800m"
    limits:
      memory: "512Mi"
      cpu: "1000m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPU: 50

config:
  nodeEnv: production
  mongodbUri: "mongodb://cosmos-cognidispatch-db:<password>@cosmos-cognidispatch-db.mongo.cosmos.azure.com:10255/cognidispatch?ssl=true&replicaSet=globaldb&retrywrites=false&maxIdleTimeMS=120000&appName=@cosmos-cognidispatch-db@"
  azureSpeechKey: "keyvault-managed"
  azureSpeechRegion: "eastus"
  azureOpenaiEndpoint: "https://cogni-openai-93849.openai.azure.com/"
  azureOpenaiKey: "keyvault-managed"
  azureOpenaiDeployment: "gpt-4o"
  allowedClientIp: "http://20.207.99.48"
  openaiApiKey: "keyvault-managed"
  mockAi: "false"

keyvault:
  enabled: true
  name: "cognidispatch-kv"
  tenantId: "0c0c1198-4f0b-4f85-8409-de831b00f9f7"
  clientId: "8cb4ee26-43f5-40b7-8b62-f84420982263"
  workloadIdentityEnabled: true

ingress:
  enabled: false
  className: "azure-application-gateway"
  annotations:
    kubernetes.io/ingress.class: "azure-application-gateway"
  hosts:
    - paths:
        - path: /api/
          pathType: Prefix
          backendName: cogni-backend-svc
          backendPort: 5000
        - path: /socket.io/
          pathType: Prefix
          backendName: cogni-backend-svc
          backendPort: 5000
        - path: /
          pathType: Prefix
          backendName: cogni-frontend-svc
          backendPort: 3000
