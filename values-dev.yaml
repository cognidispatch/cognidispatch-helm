global:
  namespace: cogni-dev
  imageRegistry: cogniregistry.azurecr.io
  imagePullPolicy: Always
  imageTag: latest

nginx:
  enabled: true
  replicas: 1
  image: cogni-nginx
  imageTag: latest
  nodePort: 30501
  resources:
    requests:
      memory: "32Mi"
      cpu: "10m"
    limits:
      memory: "128Mi"
      cpu: "100m"

authService:
  enabled: true
  replicas: 1
  image: cogni-auth-service
  imageTag: "dev-544624a"
  resources:
    requests:
      memory: "64Mi"
      cpu: "10m"
    limits:
      memory: "128Mi"
      cpu: "100m"

vendorService:
  enabled: true
  replicas: 1
  image: cogni-vendor-service
  imageTag: "dev-5d20134"
  resources:
    requests:
      memory: "64Mi"
      cpu: "10m"
    limits:
      memory: "128Mi"
      cpu: "100m"

aiService:
  enabled: true
  replicas: 1
  image: cogni-ai-service
  imageTag: "dev-bc12530"
  resources:
    requests:
      memory: "64Mi"
      cpu: "10m"
    limits:
      memory: "128Mi"
      cpu: "100m"

adminService:
  enabled: true
  replicas: 1
  image: cogni-admin-service
  imageTag: "dev-6d1427e"
  resources:
    requests:
      memory: "64Mi"
      cpu: "10m"
    limits:
      memory: "128Mi"
      cpu: "100m"

dispatchService:
  enabled: true
  replicas: 1
  image: cogni-dispatch-service
  imageTag: "dev-99c2333"
  resources:
    requests:
      memory: "64Mi"
      cpu: "15m"
    limits:
      memory: "256Mi"
      cpu: "250m"

paymentService:
  enabled: true
  replicas: 1
  image: cogni-payment-service
  imageTag: "dev-dcc1eee"
  resources:
    requests:
      memory: "64Mi"
      cpu: "10m"
    limits:
      memory: "128Mi"
      cpu: "100m"

frontend:
  enabled: true
  replicas: 1
  image: cogni-frontend
  imageTag: "dev-bfd89e5"
  nodePort: 30081
  resources:
    requests:
      memory: "64Mi"
      cpu: "15m"
    limits:
      memory: "256Mi"
      cpu: "250m"

config:
  nodeEnv: development
  mongodbUri: "mongodb://cosmos-db-placeholder-do-not-use"
  azureSpeechKey: "keyvault-managed"
  azureSpeechRegion: "eastus"
  azureOpenaiEndpoint: "https://cogni-openai-93849.openai.azure.com/"
  azureOpenaiKey: "keyvault-managed"
  azureOpenaiDeployment: "gpt-4o"
  allowedClientIp: "http://20.207.99.48"
  openaiApiKey: "keyvault-managed"
  mockAi: "false"

keyvault:
  enabled: true
  name: "cognidispatch-kv"
  tenantId: "0c0c1198-4f0b-4f85-8409-de831b00f9f7"
  clientId: "8cb4ee26-43f5-40b7-8b62-f84420982263"
  workloadIdentityEnabled: true

ingress:
  enabled: false
  className: "azure-application-gateway"
  annotations:
    kubernetes.io/ingress.class: "azure-application-gateway"
  hosts:
    - paths:
        - path: /api/
          pathType: Prefix
          backendName: cogni-backend-svc
          backendPort: 5000
        - path: /socket.io/
          pathType: Prefix
          backendName: cogni-backend-svc
          backendPort: 5000
        - path: /
          pathType: Prefix
          backendName: cogni-frontend-svc
          backendPort: 3000
