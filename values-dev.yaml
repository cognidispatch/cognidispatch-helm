global:
  namespace: cogni-dev
  imageRegistry: cogniregistry.azurecr.io
  imagePullPolicy: Always
  imageTag: latest

nginx:
  enabled: true
  replicas: 1
  image: cogni-nginx
  imageTag: latest
  nodePort: 30501
  resources:
    requests:
      memory: "16Mi"
      cpu: "1m"
    limits:
      memory: "64Mi"
      cpu: "50m"

authService:
  enabled: true
  replicas: 1
  image: cogni-auth-service
  imageTag: "dev-ce330c0"
  resources:
    requests:
      memory: "32Mi"
      cpu: "1m"
    limits:
      memory: "64Mi"
      cpu: "50m"

vendorService:
  enabled: true
  replicas: 1
  image: cogni-vendor-service
  imageTag: "dev-5d20134"
  resources:
    requests:
      memory: "32Mi"
      cpu: "1m"
    limits:
      memory: "64Mi"
      cpu: "50m"

aiService:
  enabled: true
  replicas: 1
  image: cogni-ai-service
  imageTag: "dev-bc12530"
  resources:
    requests:
      memory: "32Mi"
      cpu: "1m"
    limits:
      memory: "64Mi"
      cpu: "50m"

adminService:
  enabled: true
  replicas: 1
  image: cogni-admin-service
  imageTag: "dev-f6876f7"
  resources:
    requests:
      memory: "32Mi"
      cpu: "1m"
    limits:
      memory: "64Mi"
      cpu: "50m"

dispatchService:
  enabled: true
  replicas: 1
  image: cogni-dispatch-service
  imageTag: "dev-faed8b6"
  resources:
    requests:
      memory: "32Mi"
      cpu: "1m"
    limits:
      memory: "128Mi"
      cpu: "100m"

paymentService:
  enabled: true
  replicas: 1
  image: cogni-payment-service
  imageTag: "dev-c76fc7d"
  resources:
    requests:
      memory: "32Mi"
      cpu: "1m"
    limits:
      memory: "64Mi"
      cpu: "50m"

frontend:
  enabled: true
  replicas: 1
  image: cogni-frontend
  imageTag: "dev-e6a2bce"
  nodePort: 30081
  resources:
    requests:
      memory: "32Mi"
      cpu: "10m"
    limits:
      memory: "128Mi"
      cpu: "300m"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPU: 70

config:
  nodeEnv: development
  mongodbUri: "mongodb://cosmos-db-placeholder-do-not-use"
  azureSpeechKey: "keyvault-managed"
  azureSpeechRegion: "eastus"
  azureOpenaiEndpoint: "https://cogni-openai-eastus2-7c785.openai.azure.com/"
  azureOpenaiKey: "keyvault-managed"
  azureOpenaiDeployment: "gpt-4.1-mini"
  allowedClientIp: "http://20.207.99.48"
  openaiApiKey: "keyvault-managed"
  mockAi: "false"

keyvault:
  enabled: true
  name: "cognidispatch-kv"
  tenantId: "0c0c1198-4f0b-4f85-8409-de831b00f9f7"
  clientId: "3b00a8e4-9d13-488f-8e8e-b4842ab87168"
  workloadIdentityEnabled: true

ingress:
  enabled: false
  className: "azure-application-gateway"
  annotations:
    kubernetes.io/ingress.class: "azure-application-gateway"
  hosts:
    - paths:
        - path: /api/
          pathType: Prefix
          backendName: cogni-backend-svc
          backendPort: 5000
        - path: /socket.io/
          pathType: Prefix
          backendName: cogni-backend-svc
          backendPort: 5000
        - path: /
          pathType: Prefix
          backendName: cogni-frontend-svc
          backendPort: 3000
