apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: azure-internal-params
  namespace: kgateway-system
spec:
  kube:
    serviceOverlay:
      metadata:
        annotations:
          # Deploy KGateway as an Azure Internal Load Balancer.
          # This keeps KGateway private - only accessible from within the VNet.
          # The App Gateway (in the same Spoke VNet) routes traffic to it.
          service.beta.kubernetes.io/azure-load-balancer-internal: "true"
