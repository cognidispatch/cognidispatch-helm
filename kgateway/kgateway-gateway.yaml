apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cogni-gateway
  namespace: kgateway-system
spec:
  gatewayClassName: kgateway
  listeners:
  - protocol: HTTP
    port: 80
    name: http
    allowedRoutes:
      namespaces:
        from: All
  addresses:
  - value: 10.224.0.100
    type: IPAddress
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: azure-internal-params
