apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cogni-gateway
  namespace: kgateway-system
spec:
  gatewayClassName: kgateway
  listeners:
  - protocol: HTTP
    port: 80
    name: http
    allowedRoutes:
      namespaces:
        from: All
  # No hardcoded IP - Azure assigns a dynamic internal ILB IP from snet-aks.
  # The deploy.sh script reads this IP and updates the App Gateway backend pool.
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: azure-internal-params
